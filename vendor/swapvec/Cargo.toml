[package]
name = "swapvec"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A Vector swapping to disk after exceeding a given length"

[dependencies]
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
lz4_flex = "0.12.1"
miniz_oxide = "0.8.0"
serde = "1.0.160"
tempfile = "3.5.0"

[lib]
name = "swapvec"
crate-type = ["lib"]
