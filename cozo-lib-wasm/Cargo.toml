[package]
name = "cozo-lib-wasm"
version = "0.8.2"
edition = "2021"
description = "Cozo database for WASM"
authors = ["Ziyang Hu"]
license = "MPL-2.0"
homepage = "https://www.cozodb.org"
repository = "https://github.com/cozodb/cozo"
documentation = "https://docs.cozodb.org"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.92"
cozo = { version = "0.8.2", path = "../cozo-core", default-features = false, features = ["wasm"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true }



[dev-dependencies]
wasm-bindgen-test = "0.3.13"

#[profile.release]
## Tell `rustc` to optimize for small code size.
#opt-level = "s"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
